<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Mi agenda</title>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --container-w: 920px;
      --container-pad: 20px;
      --container-bl: 4px;

      --banner-h: 64px;
      --page-sidepad: 16px;
      --banner-bg: #e6e9ee;
      --banner-bg-hover: #d7dbe3;
    }
    body{
      font-family:'Open Sans',sans-serif;
      background:#eeeeee;
      margin:0;
      padding:20px;
      color:#333;
      padding-top: calc(var(--banner-h) + 8px);
    }
    .container{
      max-width: var(--container-w);
      margin: 0 auto;
      padding: var(--container-pad);
      background:#fff;
      border-radius:10px;
      box-shadow:0 4px 8px rgba(0,0,0,.05);
      border-left: var(--container-bl) solid #5c6bc0;
    }
    h1{ text-align:center; margin:0 0 8px; font-weight:700; }
    h2{ margin:18px 0 8px; font-weight:700; color:#000; }
    .muted{ color:#666; font-size:14px; }

    table{ width:100%; border-collapse: collapse; }
    th, td{ padding:10px; border-bottom:1px solid #eee; text-align:left; }
    th{ background:#f6f7fb; font-weight:700; color:#233247; }

    .btn{
      display:block; border:none; border-radius:6px; padding:12px 18px; color:#fff; font-weight:700; cursor:pointer;
      transition: background-color .2s, transform .2s; width:100%; margin:10px 0; font-size:16px;
    }
    .btn:hover{ transform: translateY(-1px); }
    .btn-green{ background:#66bb6a; } .btn-green:hover{ background:#43a047; }
    .btn-blue{  background:#5c6bc0; } .btn-blue:hover{  background:#3f51b5; }

    .wide75{ width:75%; margin:12px auto; }
    @media (max-width:768px){ .wide75{ width:100%; } }

    /* Banner fijo del tamaño del card */
    .app-banner{ position:fixed; top:0; left:0; right:0; height:var(--banner-h); z-index:9999; background:transparent; }
    .app-banner .banner-box{
      height:100%;
      width:min(calc(var(--container-w) + var(--container-pad)*2 + var(--container-bl)), calc(100% - var(--page-sidepad)*2));
      margin:0 auto; background:var(--banner-bg); border-bottom:1px solid rgba(0,0,0,.06); border-radius:10px;
      display:flex; align-items:center; transition:background-color .2s ease;
    }
    .app-banner .banner-box:hover,.app-banner .banner-box:focus-within{ background:var(--banner-bg-hover); }
    .app-banner .banner-inner{ display:grid; grid-template-columns: 1fr auto 1fr; align-items:center; gap:8px; width:100%; padding:0 12px; }
    .banner-back{ justify-self:start; }
    .banner-title{ justify-self:center; font-weight:700; color:#233247; }
    .banner-logo{ justify-self:end; display:inline-flex; align-items:center; }
    .banner-logo img{ width:52px; height:auto; display:block; }

    .back-button{
      display:inline-block; text-decoration:none; font-size:14px; color:#5c6bc0;
      padding:8px 12px; border:1px solid #5c6bc0; border-radius:6px; transition: background-color .2s, color .2s;
    }
    .back-button:hover{ background:#5c6bc0; color:#fff; }

    .legal-outside{
      margin:18px auto 24px; padding:10px 12px;
      max-width: calc(var(--container-w) + var(--container-pad)*2 + var(--container-bl));
      text-align:center; color:#666; font-size:14px; line-height:1.35;
    }

    .card{
      border:1px dashed #cfd6e4; border-radius:8px; padding:12px; background:#fbfcff;
    }
    .grid-two{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    @media (max-width:768px){ .grid-two{ grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <!-- Banner -->
  <header class="app-banner" role="banner">
    <div class="banner-box">
      <div class="banner-inner">
        <a href="interfaz_organizar_agenda.html" class="back-button banner-back">&larr; Volver</a>
        <div class="banner-title">Mi agenda</div>
        <a href="interfaz_inicio_s.html" class="banner-logo" aria-label="Ir al inicio">
          <img src="LogoCitasYa.png" alt="Citas Ya">
        </a>
      </div>
    </div>
  </header>

  <div class="container">
    <h1 id="welcome">Mi agenda</h1>

    <!-- 4) Citas agendadas -->
    <section>
      <h2>Citas agendadas</h2>
      <div class="card">
        <table id="tblBookings">
          <thead>
            <tr>
              <th>Asistente</th>
              <th>Fecha</th>
              <th>Inicio</th>
              <th>Fin</th>
              <th>Servicio</th>
            </tr>
          </thead>
          <tbody>
            <tr><td colspan="5" class="muted">No hay citas para mostrar.</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <!-- 5) Conectar con calendario virtual (ICS) -->
    <section class="wide75" style="margin-top:6px;">
      <button id="btnICS" class="btn btn-blue">Conectar con calendario virtual</button>
    </section>

    <!-- 2) Mi horario -->
    <section>
      <h2>Mi horario</h2>
      <div id="scheduleView" class="card">
        <div class="muted">No hay un horario publicado aún.</div>
      </div>
      <div class="muted" id="rangeInfo" style="margin-top:6px;"></div>
    </section>

    <!-- 3) Editar agenda -->
    <section class="wide75">
      <button id="btnEdit" class="btn btn-green">Editar agenda</button>
    </section>

  </div>

  <!-- Legal -->
  <div class="legal-outside">
    Todos los derechos reservados © 2025<br>
    Citas Ya S.A.S - Nit 810.000.000-0
  </div>

  <script type="module">
    import { supabase } from './supabaseClient.js';
    import { cargarSesionLocal, redirigirSegunRol } from './dataCitasYa.js';

    const $ = s => document.querySelector(s);
    const pad2 = n => String(n).padStart(2, '0');

    const DAYS = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];

    const welcome      = $('#welcome');
    const tblBody      = document.querySelector('#tblBookings tbody');
    const scheduleView = $('#scheduleView');
    const rangeInfo    = $('#rangeInfo');
    const btnEdit      = $('#btnEdit');
    const btnICS       = $('#btnICS');

    // ctx que viene de interfaz_organizar_agenda (sessionStorage)
    const CTX_KEY = 'cy_lastAgendaView';

    let ctx = null;          // { negocio_id, negocio_nombre, personal_id, personal_nombre }
    let citasEnMemoria = []; // citas enriquecidas para ICS

    function leerContextoAgenda() {
      try {
        const raw = sessionStorage.getItem(CTX_KEY);
        ctx = raw ? JSON.parse(raw) : null;
      } catch {
        ctx = null;
      }
    }

    function setWelcome() {
      if (ctx && ctx.personal_nombre) {
        welcome.textContent = `Bienvenido de nuevo, ${ctx.personal_nombre}`;
      } else {
        welcome.textContent = 'Mi agenda';
      }
    }

    function formatHoraDesdeTS(ts) {
      if (!ts) return '—';
      const d = new Date(ts);
      if (Number.isNaN(d.getTime())) return '—';
      return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
    }

    function formatFechaISO(d) {
      if (!d) return '';
      // Supabase ya envía 'YYYY-MM-DD' para DATE; lo dejamos igual
      return d;
    }

    async function asegurarContextoDesdeBD(sesion) {
      if (ctx && ctx.negocio_id && ctx.personal_id) return;

      // No hay contexto: deducimos a partir de 'personal' para este usuario
      const { data: personalRows, error } = await supabase
        .from('personal')
        .select('id, nombre_publico, negocio:negocio_id (id, nombre)')
        .eq('usuario_id', sesion.usuario_id)
        .eq('activo', true);

      if (error) {
        console.error('Error cargando personal para contexto:', error);
        alert('Ocurrió un error al cargar tu información de agenda.');
        return;
      }

      if (!personalRows || personalRows.length === 0) {
        alert('Tu usuario aún no está vinculado a ningún negocio. Pide al administrador que te asocie.');
        return;
      }

      const p = personalRows[0];
      if (!p.negocio) {
        alert('No se pudo identificar el negocio asociado a tu usuario.');
        return;
      }

      ctx = {
        negocio_id: p.negocio.id,
        negocio_nombre: p.negocio.nombre,
        personal_id: p.id,
        personal_nombre: p.nombre_publico
      };

      try {
        sessionStorage.setItem(CTX_KEY, JSON.stringify(ctx));
      } catch {
        /* ignore */
      }
    }

    async function cargarCitas() {
      tblBody.innerHTML = '';
      citasEnMemoria = [];

      if (!ctx || !ctx.negocio_id || !ctx.personal_id) {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td colspan="5" class="muted">No hay citas para mostrar.</td>`;
        tblBody.appendChild(tr);
        return;
      }

      // Citas activas: pendiente, confirmada, reprogramada (1,2,3 en estado_cita)
      const { data: citas, error } = await supabase
        .from('citas')
        .select('id, fecha, inicia_en, termina_en, usuario_cliente_id, nombre_invitado, servicio_id, estado_id')
        .eq('negocio_id', ctx.negocio_id)
        .eq('personal_id', ctx.personal_id)
        .in('estado_id', [1, 2, 3])
        .order('fecha', { ascending: true })
        .order('inicia_en', { ascending: true });

      if (error) {
        console.error('Error cargando citas:', error);
        const tr = document.createElement('tr');
        tr.innerHTML = `<td colspan="5" class="muted">Ocurrió un error al cargar las citas.</td>`;
        tblBody.appendChild(tr);
        return;
      }

      if (!citas || citas.length === 0) {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td colspan="5" class="muted">No hay citas para mostrar.</td>`;
        tblBody.appendChild(tr);
        return;
      }

      // Mapear servicios y usuarios para mostrar nombres
      const servicioIds = [...new Set(citas.map(c => c.servicio_id).filter(id => id != null))];
      const usuarioIds  = [...new Set(citas.map(c => c.usuario_cliente_id).filter(id => id != null))];

      const servicioMap = {};
      const usuarioMap  = {};

      if (servicioIds.length) {
        const { data: servicios, error: servErr } = await supabase
          .from('servicios')
          .select('id, nombre')
          .in('id', servicioIds);
        if (!servErr && servicios) {
          servicios.forEach(s => { servicioMap[s.id] = s.nombre; });
        }
      }

      if (usuarioIds.length) {
        const { data: usuarios, error: usuErr } = await supabase
          .from('usuarios')
          .select('id, nombre_completo')
          .in('id', usuarioIds);
        if (!usuErr && usuarios) {
          usuarios.forEach(u => { usuarioMap[u.id] = u.nombre_completo; });
        }
      }

      citas.forEach(c => {
        const fecha  = formatFechaISO(c.fecha);
        const inicio = formatHoraDesdeTS(c.inicia_en);
        const fin    = formatHoraDesdeTS(c.termina_en);

        let asistente = '-';
        if (c.usuario_cliente_id && usuarioMap[c.usuario_cliente_id]) {
          asistente = usuarioMap[c.usuario_cliente_id];
        } else if (c.nombre_invitado) {
          asistente = c.nombre_invitado;
        }

        const servicioNombre = servicioMap[c.servicio_id] || 'Servicio';

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${asistente}</td>
          <td>${fecha}</td>
          <td>${inicio}</td>
          <td>${fin}</td>
          <td>${servicioNombre}</td>
        `;
        tblBody.appendChild(tr);

        citasEnMemoria.push({
          id: c.id,
          fecha,
          inicio,
          fin,
          asistente,
          servicioNombre
        });
      });
    }

    async function cargarHorario() {
      scheduleView.innerHTML = '<div class="muted">No hay un horario publicado aún.</div>';
      rangeInfo.textContent = '';

      if (!ctx || !ctx.negocio_id || !ctx.personal_id) return;

      const { data: conjuntos, error } = await supabase
        .from('conjunto_horario')
        .select('id, fecha_inicio, fecha_fin, creado_en')
        .eq('negocio_id', ctx.negocio_id)
        .eq('personal_id', ctx.personal_id)
        .order('creado_en', { ascending: false })
        .limit(1);

      if (error) {
        console.error('Error cargando conjunto_horario:', error);
        return;
      }

      if (!conjuntos || conjuntos.length === 0) {
        return;
      }

      const conjunto = conjuntos[0];

      const { data: dias, error: diasErr } = await supabase
        .from('dia_horario')
        .select('dia_id, trabaja, hora_inicio, hora_fin, almuerzo_inicio, almuerzo_fin')
        .eq('conjunto_horario_id', conjunto.id)
        .order('dia_id', { ascending: true });

      if (diasErr) {
        console.error('Error cargando dia_horario:', diasErr);
        return;
      }

      if (!dias || dias.length === 0) {
        return;
      }

      const porDia = {};
      dias.forEach(d => { porDia[d.dia_id] = d; });

      const table = document.createElement('table');
      table.innerHTML = `
        <thead>
          <tr>
            <th>Día</th>
            <th>Trabaja</th>
            <th>Inicio</th>
            <th>Fin</th>
            <th>Almuerzo</th>
          </tr>
        </thead>
        <tbody></tbody>
      `;
      const tb = table.querySelector('tbody');

      for (let id = 1; id <= 7; id++) {
        const d = porDia[id] || {};
        const idx = id - 1;
        const trabaja = !!d.trabaja;

        const hIni = d.hora_inicio ? String(d.hora_inicio).slice(0,5) : '—';
        const hFin = d.hora_fin    ? String(d.hora_fin).slice(0,5)    : '—';
        const aIni = d.almuerzo_inicio ? String(d.almuerzo_inicio).slice(0,5) : '';
        const aFin = d.almuerzo_fin    ? String(d.almuerzo_fin).slice(0,5)    : '';
        const alm  = (aIni && aFin) ? `${aIni} – ${aFin}` : '—';

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${DAYS[idx]}</td>
          <td>${trabaja ? 'Sí' : 'No'}</td>
          <td>${trabaja ? hIni : '—'}</td>
          <td>${trabaja ? hFin : '—'}</td>
          <td>${trabaja ? alm : '—'}</td>
        `;
        tb.appendChild(tr);
      }

      scheduleView.innerHTML = '';
      scheduleView.appendChild(table);

      if (conjunto.fecha_inicio && conjunto.fecha_fin) {
        rangeInfo.textContent = `Rango de fechas: ${conjunto.fecha_inicio} → ${conjunto.fecha_fin}`;
      }
    }

    function toICSDate(fechaIso, hhmm) {
      if (!fechaIso || !hhmm) return '';
      const [y,m,d] = fechaIso.split('-').map(Number);
      const [H,Mi]  = hhmm.split(':').map(Number);
      return `${y}${pad2(m)}${pad2(d)}T${pad2(H)}${pad2(Mi)}00`;
    }

    function downloadICS(eventos, filename = 'mi-agenda.ics') {
      const nl = '\r\n';
      let ics = 'BEGIN:VCALENDAR' + nl
              + 'VERSION:2.0' + nl
              + 'PRODID:-//CitasYa//Agenda//ES' + nl
              + 'CALSCALE:GREGORIAN' + nl;

      eventos.forEach(e => {
        ics += 'BEGIN:VEVENT' + nl
            +  `UID:${e.uid}` + nl
            +  `DTSTAMP:${e.dtstamp}` + nl
            +  `DTSTART:${e.dtstart}` + nl
            +  `DTEND:${e.dtend}` + nl
            +  `SUMMARY:${e.summary}` + nl
            +  (e.location ? `LOCATION:${e.location}${nl}` : '')
            +  (e.description ? `DESCRIPTION:${e.description.replace(/\n/g, '\\n')}${nl}` : '')
            +  'END:VEVENT' + nl;
      });

      ics += 'END:VCALENDAR' + nl;

      const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    btnICS.addEventListener('click', () => {
      if (!citasEnMemoria.length) {
        alert('No hay citas para exportar.');
        return;
      }

      const now = new Date();
      const dtstamp = now.getFullYear()
        + pad2(now.getMonth() + 1)
        + pad2(now.getDate())
        + 'T'
        + pad2(now.getHours())
        + pad2(now.getMinutes())
        + '00';

      const businessName = ctx?.negocio_nombre || '';
      const staffName    = ctx?.personal_nombre || 'barbero';

      const evts = citasEnMemoria.map(c => ({
        uid: (c.id || Math.random().toString(36).slice(2)) + '@citasya',
        dtstamp,
        dtstart: toICSDate(c.fecha, c.inicio),
        dtend:   toICSDate(c.fecha, c.fin),
        summary: `Cita - ${c.servicioNombre || 'Servicio'}`,
        location: businessName,
        description: `Asistente: ${c.asistente || '-'}\nBarbero: ${staffName}\nEstablecimiento: ${businessName || '-'}`
      }));

      const fname = `agenda-${staffName.replace(/\s+/g, '_')}.ics`;
      downloadICS(evts, fname);
    });

    btnEdit.addEventListener('click', () => {
      window.location.href = 'interfaz_organizar_agenda.html';
    });

    document.addEventListener('DOMContentLoaded', async () => {
      const sesion = cargarSesionLocal();
      if (!sesion || !sesion.auth_user_id || !sesion.usuario_id) {
        alert('Debes iniciar sesión para ver tu agenda.');
        window.location.href = 'interfaz_login.html';
        return;
      }

      if (Number(sesion.rol_id) === 1) {
        alert('Esta sección es solo para barberos / negocios.');
        redirigirSegunRol(sesion.rol_id);
        return;
      }

      leerContextoAgenda();
      await asegurarContextoDesdeBD(sesion);
      setWelcome();

      await cargarCitas();
      await cargarHorario();
    });
  </script>
</body>
</html>
