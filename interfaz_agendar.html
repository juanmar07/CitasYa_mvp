<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Programar una cita</title>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --container-w: 920px;
      --container-pad: 20px;
      --container-bl: 4px;

      --banner-h: 64px;
      --page-sidepad: 16px;
      --banner-bg: #e6e9ee;
      --banner-bg-hover: #d7dbe3;
    }

    body{
      font-family: 'Open Sans', sans-serif;
      background:#eeeeee;
      margin:0;
      padding:20px;
      color:#333;
      padding-top: calc(var(--banner-h) + 8px);
    }
    .container{
      max-width: var(--container-w);
      margin: 0 auto;
      padding: var(--container-pad);
      background:#fff;
      border-radius:10px;
      box-shadow:0 4px 8px rgba(0,0,0,.05);
      border-left: var(--container-bl) solid #5c6bc0;
    }
    h1{ text-align:center; margin:0 0 14px; font-weight:700; color:#000; }
    label{ display:block; margin:8px 0 4px; color:#003366; }
    .muted{ color:#666; font-size:14px; }

    input[type="text"], input[type="date"], select, textarea{
      width:100%; padding:10px; border:2px solid #ddd; border-radius:6px; font-size:16px;
      transition: border-color .2s; box-sizing:border-box;
    }
    input:focus, select:focus, textarea:focus{ outline:none; border-color:#7da2a9; }

    .row{ display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
    .two-btns{ display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
    .wide75{ width:75%; margin:12px auto; }
    @media (max-width:768px){ .row, .two-btns, .wide75{ grid-template-columns:1fr; width:100%; } }

    .btn{
      display:block; border:none; border-radius:6px; padding:12px 18px; color:#fff; font-weight:700; cursor:pointer;
      transition: background-color .2s, transform .2s; width:100%; margin:10px 0; font-size:16px;
    }
    .btn:hover{ transform: translateY(-1px); }
    .btn-green{ background:#66bb6a; } .btn-green:hover{ background:#43a047; }
    .btn-blue{  background:#5c6bc0; } .btn-blue:hover{  background:#3f51b5; }
    .btn-red{   background:#ef5350; } .btn-red:hover{   background:#e53935; }

    /* Banner fijo del tamaño del card */
    .app-banner{ position:fixed; top:0; left:0; right:0; height:var(--banner-h); z-index:9999; background:transparent; }
    .app-banner .banner-box{
      height:100%;
      width:min(calc(var(--container-w) + var(--container-pad)*2 + var(--container-bl)), calc(100% - var(--page-sidepad)*2));
      margin:0 auto; background:var(--banner-bg); border-bottom:1px solid rgba(0,0,0,.06); border-radius:10px;
      display:flex; align-items:center; transition:background-color .2s ease;
    }
    .app-banner .banner-box:hover,.app-banner .banner-box:focus-within{ background:var(--banner-bg-hover); }
    .app-banner .banner-inner{ display:grid; grid-template-columns: 1fr auto 1fr; align-items:center; gap:8px; width:100%; padding:0 12px; }
    .banner-back{ justify-self:start; }
    .banner-title{ justify-self:center; font-weight:700; color:#233247; }
    .banner-logo{ justify-self:end; display:inline-flex; align-items:center; }
    .banner-logo img{ width:52px; height:auto; display:block; }

    .back-button{
      display:inline-block; text-decoration:none; font-size:14px; color:#5c6bc0;
      padding:8px 12px; border:1px solid #5c6bc0; border-radius:6px; transition: background-color .2s, color .2s;
    }
    .back-button:hover{ background:#5c6bc0; color:#fff; }

    /* Footer legal fuera del card */
    .legal-outside{
      margin:18px auto 24px; padding:10px 12px;
      max-width: calc(var(--container-w) + var(--container-pad)*2 + var(--container-bl));
      text-align:center; color:#666; font-size:14px; line-height:1.35;
    }
  </style>
</head>
<body>

  <!-- Banner -->
  <header class="app-banner" role="banner">
    <div class="banner-box">
      <div class="banner-inner">
        <a href="#" class="back-button banner-back" onclick="history.back(); return false;">&larr; Volver</a>
        <div class="banner-title">Programación de Citas</div>
        <a href="interfaz_agendar_publico.html" class="banner-logo" aria-label="Ir al inicio">
          <img src="LogoCitasYa.png" alt="Citas Ya">
        </a>
      </div>
    </div>
  </header>

  <div class="container">
    <h1>Programación de Citas</h1>

    <!-- 1. Asistente -->
    <section>
      <label for="attendee">Ingrese nombre completo del asistente</label>
      <input type="text" id="attendee" placeholder="Ej: Juan Martín Betancur">
    </section>

    <!-- 2–4. Barbería + “Buscar por mapa” -->
    <section>
      <label for="biz">Ingrese el nombre del establecimiento</label>
      <input type="text" id="biz" list="businessList" placeholder="Ej: Barbería Central">
      <datalist id="businessList"></datalist>

      <div style="display:flex; align-items:center; gap:10px; margin-top:8px;">
        <label style="display:flex; align-items:center; gap:8px; margin:0;">
          <input type="checkbox" id="dontKnow"> ¿No recuerda el nombre del establecimiento?
        </label>
        <button type="button" id="btnMap" class="btn btn-blue" style="width:auto; display:none; margin:0;">Buscar por mapa</button>
      </div>
      <small class="muted">La búsqueda ignora mayúsculas y acentos.</small>
    </section>

    <!-- 5. Servicio -->
    <section>
      <label for="service">Seleccione el servicio</label>
      <select id="service" disabled>
        <option value="">— Seleccione —</option>
      </select>
      <small class="muted" id="svcDur">Duración: —</small>
    </section>

    <!-- 5.1 Barbero -->
    <section>
      <label for="staff">Seleccione el barbero</label>
      <select id="staff" disabled>
        <option value="">— Seleccione —</option>
      </select>
    </section>

    <!-- 6. Fecha y hora -->
    <section>
      <div class="row">
        <div>
          <label for="date">Seleccione la fecha de la cita</label>
          <input type="date" id="date">
        </div>
        <div>
          <label for="timeSel">Seleccione la hora de la cita</label>
          <select id="timeSel" disabled>
            <option value="">— Selecciona fecha, servicio y barbero —</option>
          </select>
          <small class="muted" id="timeHelp"></small>
        </div>
      </div>
    </section>

    <!-- 7. Acciones -->
    <section class="two-btns wide75">
      <button id="btnSchedule" class="btn btn-green">Programar cita</button>
      <button id="btnClear" class="btn btn-blue">Limpiar</button>
    </section>

    <!-- Resumen -->
    <section>
      <textarea id="summary" placeholder="Aquí verás el resumen de tu cita…" aria-label="Resumen" readonly></textarea>
    </section>

    <!-- 8. Comentarios / Cancelar -->
    <section class="two-btns wide75">
      <button type="button" id="btnComment" class="btn btn-blue">Déjanos tu comentario</button>
      <button type="button" id="btnCancel" class="btn btn-red">Cancelar una cita</button>
    </section>
  </div>

  <!-- Legal -->
  <div class="legal-outside">
    Todos los derechos reservados © 2025<br>
    Citas Ya S.A.S - Nit 810.000.000-0
  </div>

<script type="module">
  import { supabase } from './supabaseClient.js';
  import { cargarSesionLocal } from './dataCitasYa.js';

  /* ==================== Helpers ==================== */
  const SS_RETURN = 'cy_return_to';

  const $ = (s) => document.querySelector(s);
  const normalize = (s) =>
    (s || '')
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, ' ')
      .trim();

  const addMinutes = (hhmm, mins) => {
    const [h, m] = hhmm.split(':').map((n) => parseInt(n, 10));
    const d = new Date(2000, 0, 1, h, m, 0);
    d.setMinutes(d.getMinutes() + mins);
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  };

  const toMin = (t) => {
    const [h, m] = t.split(':').map(Number);
    return h * 60 + m;
  };

  const overlap = (aS, aE, bS, bE) =>
    toMin(aS) < toMin(bE) && toMin(bS) < toMin(aE);

  function windowsFromDay(d) {
    if (!d || !d.work || !d.start || !d.end || d.start >= d.end) return [];
    const base = [[d.start, d.end]];
    if (d.lunchStart && d.lunchEnd && d.lunchStart < d.lunchEnd) {
      const out = [];
      base.forEach(([a, b]) => {
        if (d.lunchStart > a) out.push([a, Math.min(b, d.lunchStart)]);
        if (d.lunchEnd < b) out.push([Math.max(a, d.lunchEnd), b]);
      });
      return out.filter(([a, b]) => a < b);
    }
    return base;
  }

  function slotsFromWindows(wins, dur) {
    const s = [];
    for (const [a, b] of wins) {
      let t = a;
      while (toMin(t) + dur <= toMin(b)) {
        s.push(t);
        t = addMinutes(t, 10); // pasos de 10 min
      }
    }
    return s;
  }

  // getDay() -> id de dias_semana (1=lunes,...,7=domingo)
  const JS_TO_DB_DIA = [7, 1, 2, 3, 4, 5, 6];

  /* ==================== DOM ==================== */
  const attendee    = $('#attendee');

  const bizInput    = $('#biz');
  const bizList     = $('#businessList');
  const dontKnow    = $('#dontKnow');
  const btnMap      = $('#btnMap');
  const modalMap    = $('#modalMap');
  const closeMap    = $('#closeMap');
  const bizListModal= $('#bizList');

  const service     = $('#service');
  const svcDur      = $('#svcDur');
  const staff       = $('#staff');
  const dateEl      = $('#date');
  const timeSel     = $('#timeSel');
  const timeHelp    = $('#timeHelp');

  const btnSchedule = $('#btnSchedule');
  const btnClear    = $('#btnClear');
  const btnComment  = $('#btnComment');
  const btnCancel   = $('#btnCancel');
  const summary     = $('#summary');

  /* ==================== Estado ==================== */
  let negocios = [];
  let negocioSeleccionado = null;
  let serviciosNegocioActual = [];
  let personalNegocioActual  = [];
  let estadoCitaPendienteId  = null;

  /* ==================== Sesión ==================== */
  function getSesion() {
    try {
      return cargarSesionLocal();
    } catch {
      return null;
    }
  }

  function requireSesion() {
    const ses = getSesion();
    if (!ses || !ses.usuario_id) {
      sessionStorage.setItem(SS_RETURN, 'interfaz_agendar.html');
      window.location.href = 'interfaz_login.html';
      return null;
    }
    return ses;
  }

  /* ==================== Carga de datos Supabase ==================== */

  async function cargarEstadoPendiente() {
    if (estadoCitaPendienteId) return;
    const { data, error } = await supabase
      .from('estado_cita')
      .select('id')
      .eq('nombre', 'pendiente')
      .maybeSingle();

    if (error) {
      console.warn('No se pudo cargar estado "pendiente":', error.message);
      return;
    }
    if (data) estadoCitaPendienteId = data.id;
  }

  async function loadNegocios() {
    bizList.innerHTML = '';
    negocios = [];

    const { data, error } = await supabase.rpc('get_public_negocios');
    if (error) {
      console.error('Error cargando negocios:', error.message);
      return;
    }

    negocios = (data || []).slice().sort((a, b) =>
      (a.nombre || '').localeCompare(b.nombre || '', 'es', { sensitivity: 'base' })
    );

    negocios.forEach((n) => {
      const op = document.createElement('option');
      op.value = n.nombre || '';
      bizList.appendChild(op);
    });
  }

  function findNegocioByNombre(nombre) {
    const target = normalize(nombre);
    if (!target) return null;
    return negocios.find((n) => normalize(n.nombre) === target) || null;
  }

  function setDurationHintFromService() {
    const dur = service.options[service.selectedIndex]?.dataset.duration || '';
    svcDur.textContent = dur ? `Duración: ${dur} min` : 'Duración: —';
  }

  async function populateServiceAndStaff(name, preSvcId = '', preStaffId = '') {
    service.innerHTML = '<option value="">— Seleccione —</option>';
    staff.innerHTML   = '<option value="">— Seleccione —</option>';
    svcDur.textContent = 'Duración: —';
    negocioSeleccionado = null;
    serviciosNegocioActual = [];
    personalNegocioActual  = [];

    const match = findNegocioByNombre(name);
    if (!match) {
      timeSel.disabled = true;
      timeSel.innerHTML = '<option value="">— Selecciona fecha, servicio y barbero —</option>';
      timeHelp.textContent = '';
      return;
    }
    negocioSeleccionado = match;

    const [{ data: servData, error: errServ }, { data: persData, error: errPers }] =
      await Promise.all([
        supabase
          .from('servicios')
          .select('id, nombre, duracion_min')
          .eq('negocio_id', match.id)
          .eq('activo', true)
          .order('orden', { ascending: true }),
        supabase
          .from('personal')
          .select('id, nombre_publico')
          .eq('negocio_id', match.id)
          .eq('activo', true),
      ]);

    if (errServ) console.error('Error cargando servicios:', errServ.message);
    if (errPers) console.error('Error cargando personal:', errPers.message);

    serviciosNegocioActual = servData || [];
    personalNegocioActual  = persData || [];

    serviciosNegocioActual.forEach((s) => {
      const op = document.createElement('option');
      op.value = String(s.id);
      op.textContent = `${s.nombre} (${s.duracion_min} min)`;
      op.dataset.duration = s.duracion_min;
      service.appendChild(op);
    });

    personalNegocioActual.forEach((p) => {
      const op = document.createElement('option');
      op.value = String(p.id);
      op.textContent = p.nombre_publico;
      staff.appendChild(op);
    });

    if (preSvcId) service.value = String(preSvcId);
    if (preStaffId) staff.value = String(preStaffId);

    setDurationHintFromService();
    await buildTimeOptions();
    updateSummary();
  }

  async function buildTimeOptions() {
    timeSel.innerHTML = '<option value="">— Selecciona fecha, servicio y barbero —</option>';
    timeSel.disabled = true;
    timeHelp.textContent = '';

    const negocio = negocioSeleccionado;
    const servicioId = service.value;
    const personalId = staff.value;
    const fechaISO   = dateEl.value;

    if (!negocio || !servicioId || !personalId || !fechaISO) return;

    const dur = Number(service.options[service.selectedIndex]?.dataset.duration || 0);
    if (!dur) {
      timeHelp.textContent = 'No se encontró duración del servicio.';
      return;
    }

    // 1. Bloque de horario que cubre la fecha
    const { data: bloques, error: errBloques } = await supabase
      .from('conjunto_horario')
      .select('id, fecha_inicio, fecha_fin, creado_en')
      .eq('negocio_id', negocio.id)
      .eq('personal_id', personalId)
      .lte('fecha_inicio', fechaISO)
      .gte('fecha_fin', fechaISO)
      .order('creado_en', { ascending: false })
      .limit(1);

    if (errBloques) {
      console.error('Error cargando horarios:', errBloques.message);
      timeHelp.textContent = 'Error al cargar el horario. Intenta de nuevo.';
      return;
    }
    if (!bloques || !bloques.length) {
      timeHelp.textContent = 'Sin horario publicado para esa fecha.';
      return;
    }

    const bloque = bloques[0];

    const { data: dias, error: errDias } = await supabase
      .from('dia_horario')
      .select('dia_id, trabaja, hora_inicio, hora_fin, almuerzo_inicio, almuerzo_fin')
      .eq('conjunto_horario_id', bloque.id);

    if (errDias) {
      console.error('Error cargando días de horario:', errDias.message);
      timeHelp.textContent = 'Error al cargar el horario del día.';
      return;
    }

    const jsIdx = new Date(fechaISO + 'T00:00:00').getDay(); // 0..6
    const diaIdEsperado = JS_TO_DB_DIA[jsIdx];
    const diaRow = (dias || []).find((d) => d.dia_id === diaIdEsperado);

    if (!diaRow || !diaRow.trabaja || !diaRow.hora_inicio || !diaRow.hora_fin || diaRow.hora_inicio >= diaRow.hora_fin) {
      timeHelp.textContent = 'Sin horario publicado para ese día.';
      return;
    }

    const day = {
      work: diaRow.trabaja,
      start: diaRow.hora_inicio.slice(0, 5),
      end: diaRow.hora_fin.slice(0, 5),
      lunchStart: diaRow.almuerzo_inicio ? diaRow.almuerzo_inicio.slice(0, 5) : null,
      lunchEnd:   diaRow.almuerzo_fin ? diaRow.almuerzo_fin.slice(0, 5) : null,
    };

    const wins  = windowsFromDay(day);
    let slots   = slotsFromWindows(wins, dur);

    // 2. Quitar slots ocupados por citas reales
    const { data: citas, error: errCitas } = await supabase
      .from('citas')
      .select('inicia_en, termina_en')
      .eq('negocio_id', negocio.id)
      .eq('personal_id', personalId)
      .eq('fecha', fechaISO);

    if (!errCitas && citas && citas.length) {
      const ocupadas = citas.map((c) => {
        const ini = new Date(c.inicia_en);
        const fin = new Date(c.termina_en);
        const s = String(ini.getHours()).padStart(2, '0') + ':' + String(ini.getMinutes()).padStart(2, '0');
        const e = String(fin.getHours()).padStart(2, '0') + ':' + String(fin.getMinutes()).padStart(2, '0');
        return { start: s, end: e };
      });

      slots = slots.filter((t) => {
        const e = addMinutes(t, dur);
        return !ocupadas.some((b) => overlap(t, e, b.start, b.end));
      });
    }

    if (!slots.length) {
      timeHelp.textContent = 'No hay horas disponibles para ese día.';
      return;
    }

    timeSel.innerHTML = '<option value="">— Selecciona una hora —</option>';
    slots.forEach((t) => {
      const op = document.createElement('option');
      op.value = t;
      op.textContent = t;
      timeSel.appendChild(op);
    });
    timeSel.disabled = false;
  }

  /* ==================== Mapa de negocios ==================== */

  function openMap() {
    bizListModal.innerHTML = '';
    if (!negocios.length) {
      bizListModal.textContent = 'No hay establecimientos registrados.';
    } else {
      negocios.forEach((b) => {
        const nameDiv = document.createElement('div');
        nameDiv.innerHTML = `<strong>${b.nombre || 'Sin nombre'}</strong><br><span class="muted">${b.direccion || ''}</span>`;

        const selBtn = document.createElement('button');
        selBtn.className = 'btn btn-blue';
        selBtn.style.width = 'auto';
        selBtn.style.margin = '0';
        selBtn.textContent = 'Seleccionar';
        selBtn.addEventListener('click', () => {
          bizInput.value = b.nombre || '';
          modalMap.style.display = 'none';
          populateServiceAndStaff(b.nombre || '').catch(console.error);
        });

        const mapBtn = document.createElement('a');
        mapBtn.className = 'btn btn-green';
        mapBtn.style.width = 'auto';
        mapBtn.style.margin = '0';
        mapBtn.textContent = 'Ver en mapa';

        const url =
          b.latitud && b.longitud
            ? `https://www.google.com/maps?q=${b.latitud},${b.longitud}`
            : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(b.nombre || '')}`;

        mapBtn.href = url;
        mapBtn.target = '_blank';

        bizListModal.appendChild(nameDiv);
        bizListModal.appendChild(selBtn);
        bizListModal.appendChild(mapBtn);
      });
    }
    modalMap.style.display = 'flex';
  }

  /* ==================== Programar cita ==================== */

  function updateSummary() {
    const ses = getSesion();
    const nombreCliente = attendee.value.trim() || (ses?.nombre_completo || ses?.nombre || '');

    const negocio = negocioSeleccionado;
    const svc = serviciosNegocioActual.find((s) => String(s.id) === String(service.value));
    const barber = personalNegocioActual.find((p) => String(p.id) === String(staff.value));

    const f = dateEl.value || '';
    const h = timeSel.value || '';
    const dur = svc ? Number(svc.duracion_min || 0) : 0;
    const hEnd = h && dur ? addMinutes(h, dur) : '';

    summary.value =
      (nombreCliente ? `Asistente: ${nombreCliente}\n` : '') +
      (negocio ? `Establecimiento: ${negocio.nombre}\n` : '') +
      (svc ? `Servicio: ${svc.nombre} (${svc.duracion_min} min)\n` : '') +
      (barber ? `Barbero: ${barber.nombre_publico}\n` : '') +
      (f ? `Fecha: ${f}\n` : '') +
      (h ? `Hora: ${h}${hEnd ? ' - ' + hEnd : ''}\n` : '');
  }

  async function programar() {
    const ses = requireSesion();
    if (!ses) return;

    const asist = attendee.value.trim() || ses.nombre_completo || ses.nombre;
    const negocio = negocioSeleccionado;
    const svcId = service.value;
    const personalId = staff.value;
    const f = dateEl.value;
    const h = timeSel.value;

    if (!asist || !negocio || !svcId || !personalId || !f || !h) {
      alert('Completa todos los campos antes de programar la cita.');
      return;
    }

    const servicioSel = serviciosNegocioActual.find((s) => String(s.id) === String(svcId));
    const barberSel   = personalNegocioActual.find((p) => String(p.id) === String(personalId));

    if (!servicioSel || !barberSel) {
      alert('Servicio o barbero inválido.');
      return;
    }

    await cargarEstadoPendiente();
    if (!estadoCitaPendienteId) {
      alert('No se encontró el estado "pendiente" en la base de datos.');
      return;
    }

    const dur = Number(servicioSel.duracion_min || 0);
    const inicioDate = new Date(`${f}T${h}:00`);
    const finDate    = new Date(inicioDate.getTime() + dur * 60000);

    // comprobación rápida de choque
    const { data: citas, error: errCitas } = await supabase
      .from('citas')
      .select('inicia_en, termina_en')
      .eq('negocio_id', negocio.id)
      .eq('personal_id', personalId)
      .eq('fecha', f);

    if (errCitas) {
      console.error('Error verificando choques:', errCitas.message);
    } else if (citas && citas.length) {
      const hayChoque = citas.some((c) => {
        const ini = new Date(c.inicia_en);
        const fin = new Date(c.termina_en);
        const s = String(ini.getHours()).padStart(2, '0') + ':' + String(ini.getMinutes()).padStart(2, '0');
        const e = String(fin.getHours()).padStart(2, '0') + ':' + String(fin.getMinutes()).padStart(2, '0');
        return overlap(h, addMinutes(h, dur), s, e);
      });
      if (hayChoque) {
        alert('Esa franja ya está ocupada. Elige otra hora.');
        return;
      }
    }

    const { error } = await supabase
      .from('citas')
      .insert({
        negocio_id:         negocio.id,
        personal_id:        personalId,
        servicio_id:        svcId,
        usuario_cliente_id: ses.usuario_id,
        nombre_invitado:    asist,
        fecha:              f,
        inicia_en:          inicioDate.toISOString(),
        termina_en:         finDate.toISOString(),
        estado_id:          estadoCitaPendienteId,
        notas:              null,
      });

    if (error) {
      console.error('Error al programar cita:', error.message);
      alert('Ocurrió un error al programar la cita. Intenta nuevamente.');
      return;
    }

    updateSummary();
    alert('¡Cita programada con éxito!');
  }

  function limpiarFormulario() {
    attendee.value = '';
    bizInput.value = '';
    service.innerHTML = '<option value="">— Seleccione —</option>';
    staff.innerHTML   = '<option value="">— Seleccione —</option>';
    svcDur.textContent = 'Duración: —';
    negocioSeleccionado = null;
    serviciosNegocioActual = [];
    personalNegocioActual  = [];
    dateEl.value = '';
    timeSel.innerHTML = '<option value="">— Selecciona fecha, servicio y barbero —</option>';
    timeSel.disabled = true;
    timeHelp.textContent = '';
    summary.value = '';
  }

  /* ==================== Eventos ==================== */

  dontKnow.addEventListener('change', () => {
    btnMap.style.display = dontKnow.checked ? 'inline-block' : 'none';
  });

  btnMap.addEventListener('click', openMap);
  closeMap.addEventListener('click', () => { modalMap.style.display = 'none'; });
  modalMap.addEventListener('click', (e) => {
    if (e.target === modalMap) modalMap.style.display = 'none';
  });

  function handleBizInput() {
    populateServiceAndStaff(bizInput.value).catch(console.error);
  }

  bizInput.addEventListener('blur', handleBizInput);
  bizInput.addEventListener('change', handleBizInput);
  bizInput.addEventListener('input', () => {
    clearTimeout(bizInput._t);
    bizInput._t = setTimeout(handleBizInput, 300);
  });

  service.addEventListener('change', () => {
    setDurationHintFromService();
    buildTimeOptions().catch(console.error);
    updateSummary();
  });

  staff.addEventListener('change', () => {
    buildTimeOptions().catch(console.error);
    updateSummary();
  });

  dateEl.addEventListener('change', () => {
    buildTimeOptions().catch(console.error);
    updateSummary();
  });

  attendee.addEventListener('input', updateSummary);
  timeSel.addEventListener('change', updateSummary);

  btnSchedule.addEventListener('click', () => {
    programar().catch((err) => {
      console.error(err);
      alert('Ocurrió un error inesperado al programar la cita.');
    });
  });

  btnClear.addEventListener('click', () => {
    limpiarFormulario();
  });

  btnComment.addEventListener('click', () => {
    window.location.href = 'interfaz_comentarios.html';
  });

  btnCancel.addEventListener('click', () => {
    window.location.href = 'interfaz_cancelar.html';
  });

  /* ==================== Init ==================== */
  async function init() {
    const ses = requireSesion();
    if (!ses) return;

    await Promise.all([loadNegocios(), cargarEstadoPendiente()]);

    // Autocompletar nombre del asistente con el nombre del usuario si está vacío
    const nombre = ses.nombre_completo || ses.nombre;
    if (nombre && !attendee.value) {
      attendee.value = nombre;
    }

    updateSummary();
  }

  init().catch((err) => console.error('Error inicializando interfaz_agendar:', err));
</script>


</body>
