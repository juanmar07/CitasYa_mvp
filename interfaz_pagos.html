<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Pagos - Citas Ya</title>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    /* --- TODO EL CSS ORIGINAL SE MANTIENE IGUAL --- */
    :root{
      --container-w: 920px;
      --container-pad: 20px;
      --container-bl: 4px;
      --banner-h: 64px;
      --page-sidepad: 16px;
      --banner-bg: #e6e9ee;
      --banner-bg-hover: #d7dbe3;
    }
    body{
      font-family: 'Open Sans', sans-serif;
      background:#eeeeee;
      margin:0;
      padding:20px;
      color:#333;
      padding-top: calc(var(--banner-h) + 8px);
    }
    .container{
      max-width: var(--container-w);
      margin: 0 auto;
      padding: var(--container-pad);
      background:#fff;
      border-radius:10px;
      box-shadow:0 4px 8px rgba(0,0,0,.05);
      border-left: var(--container-bl) solid #5c6bc0;
    }
    h1{ text-align:center; margin:0 0 14px; font-weight:700; color:#000; }
    h2{ margin:20px 0 12px; font-weight:700; color:#000; }
    h3{ margin:12px 0 8px; color:#233247; }
    label{ display:block; margin:8px 0 4px; color:#003366; }
    input[type="text"], input[type="number"], select, textarea{
      width:100%; padding:10px; border:2px solid #ddd; border-radius:6px; font-size:16px;
      transition: border-color .2s; box-sizing:border-box;
    }
    textarea{ min-height:210px; resize:vertical; }
    .muted{ color:#666; font-size:14px; }
    .row{ display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
    .row-3{ display:grid; grid-template-columns: 1fr 1fr 1fr; gap:12px; }
    .packages{
      border:1px dashed #bdbdbd; border-radius:8px; padding:12px; background:#fafafa; margin:8px 0 12px;
    }
    .packages ul{ margin:6px 0 0 18px; }
    .price{ font-weight:700; }
    .btn{
      display:block; border:none; border-radius:6px; padding:12px 18px; color:#fff; font-weight:700; cursor:pointer;
      transition: background-color .2s, transform .2s; width:100%; margin:10px 0; font-size:16px;
    }
    .btn:hover{ transform: translateY(-1px); }
    .btn-green{ background:#66bb6a; } .btn-green:hover{ background:#43a047; }
    .btn-blue{ background:#5c6bc0; } .btn-blue:hover{ background:#3f51b5; }
    .radio-group{ display:flex; align-items:center; gap:10px; }
    .app-banner{ position:fixed; top:0; left:0; right:0; height:var(--banner-h); z-index:9999; background:transparent; }
    .app-banner .banner-box{
      height:100%; width:min(calc(var(--container-w) + var(--container-pad)*2 + var(--container-bl)), calc(100% - var(--page-sidepad)*2));
      margin:0 auto; background:var(--banner-bg); border-bottom:1px solid rgba(0,0,0,.06); border-radius:10px;
      display:flex; align-items:center; transition:background-color .2s ease;
    }
    .app-banner .banner-box:hover,.app-banner .banner-box:focus-within{ background:var(--banner-bg-hover); }
    .app-banner .banner-inner{
      display:grid; grid-template-columns: 1fr auto 1fr;
      align-items:center; gap:8px; width:100%; padding:0 12px;
    }
    .banner-back{ justify-self:start; }
    .banner-title{ justify-self:center; font-weight:700; color:#233247; }
    .banner-logo{ justify-self:end; display:inline-flex; align-items:center; }
    .banner-logo img{ width:52px; height:auto; display:block; }
    .legal-outside{
      margin: 18px auto 24px; padding:10px 12px;
      max-width: calc(var(--container-w) + var(--container-pad)*2 + var(--container-bl));
      text-align:center; color:#666; font-size:14px; line-height:1.35;
    }
  </style>
</head>

<body>

  <!-- BANNER -->
  <header class="app-banner" role="banner">
    <div class="banner-box">
      <div class="banner-inner">
        <a href="interfaz_inicio_s.html" class="back-button banner-back">&larr; Volver</a>
        <div class="banner-title">Pagos</div>
        <a href="interfaz_inicio_s.html" class="banner-logo"><img src="LogoCitasYa.png" /></a>
      </div>
    </div>
  </header>

  <div class="container">
    <h1>Comprar tokens</h1>

    <p class="muted">Cada <strong>30 min</strong> de cita consume <strong>1 token</strong>.</p>

    <div class="packages">
      <strong>Paquetes disponibles</strong>
      <ul>
        <li>50 tokens — <strong>$21.000</strong></li>
        <li>100 tokens — <strong>$34.000</strong></li>
        <li>150 tokens — <strong>$42.000</strong></li>
        <li>200 tokens — <strong>$44.000</strong></li>
      </ul>
    </div>

    <section>
      <h2>Selecciona tu compra</h2>
      <div class="row">
        <div>
          <label>Paquetes</label>
          <select id="paquete">
            <option value="">— Elegir —</option>
            <option value="50">50 tokens — $21.000</option>
            <option value="100">100 tokens — $34.000</option>
            <option value="150">150 tokens — $42.000</option>
            <option value="200">200 tokens — $44.000</option>
          </select>
        </div>
        <div>
          <label>Cantidad manual</label>
          <input type="number" id="manual" min="1" />
        </div>
      </div>
    </section>

    <section>
      <h2>Resumen</h2>
      <div class="row-3">
        <div>
          <label>Tokens</label>
          <input id="resumen_tokens" readonly />
        </div>
        <div>
          <label>Valor</label>
          <input id="resumen_valor" readonly />
        </div>
        <div>
          <label>Método</label>
          <input value="Mercado Pago" readonly />
        </div>
      </div>
    </section>

    <button id="btnPagar" class="btn btn-green btn-slim">Realizar pago</button>
  </div>

  <div class="legal-outside">Todos los derechos reservados © 2025 — Citas Ya S.A.S</div>

  <!-- JS MODULAR -->
  <script type="module">
    import { cargarSesionLocal } from "./dataCitasYa.js";

    const sesion = cargarSesionLocal();
    if (!sesion || !sesion.usuario_id) {
      alert("Debes iniciar sesión para comprar tokens.");
      window.location.href = "interfaz_login.html";
    }

    // --- Precios exactos ---
    const PACKS = {
      "50": 21000,
      "100": 34000,
      "150": 42000,
      "200": 44000
    };

    const LINKS = {
      "50": "https://mpago.li/28hZUAL",
      "100":"https://mpago.li/2yEEqdM",
      "150":"https://mpago.li/1wcD9Gp",
      "200":"https://mpago.li/1S7Hwd5",
      "generic":"https://link.mercadopago.com.co/citasya"
    };

    const paquete = document.querySelector("#paquete");
    const manual  = document.querySelector("#manual");
    const resTok  = document.querySelector("#resumen_tokens");
    const resVal  = document.querySelector("#resumen_valor");
    const btnPay  = document.querySelector("#btnPagar");

    function fmt(n){ return Number(n).toLocaleString("es-CO"); }

    function actualizarResumen(){
      if (paquete.value){
        resTok.value = `${paquete.value} tokens`;
        resVal.value = `$ ${fmt(PACKS[paquete.value])}`;
        return;
      }
      const m = parseInt(manual.value);
      if (m > 0){
        // Tarifa manual
        let unit = 420;
        if (m <= 50) unit = 420;
        else if (m <= 100) unit = 340;
        else if (m <= 150) unit = 280;
        else unit = 220;
        resTok.value = `${m} tokens`;
        resVal.value = `$ ${fmt(m * unit)}`;
        return;
      }
      resTok.value = "";
      resVal.value = "";
    }

    paquete.addEventListener("change", () => {
      manual.value = "";
      actualizarResumen();
    });

    manual.addEventListener("input", () => {
      paquete.value = "";
      actualizarResumen();
    });

    btnPay.addEventListener("click", () => {
      if (paquete.value){
        window.location.href = LINKS[paquete.value];
        return;
      }
      const m = parseInt(manual.value);
      if (m > 0){
        window.location.href = LINKS.generic;
        return;
      }
      alert("Selecciona un paquete o ingresa una cantidad.");
    });

  </script>

</body>
</html>
